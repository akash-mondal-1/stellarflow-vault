name: CI/CD Pipeline

on:
push:
branches:
- main
- master
pull_request:
branches:
- main
- master

jobs:
rust-tests:
name: Rust Contracts Tests
runs-on: ubuntu-latest

```
steps:
  - name: Checkout Code
    uses: actions/checkout@v4

  - name: Setup Rust Toolchain
    uses: dtolnay/rust-toolchain@stable
    with:
      targets: wasm32v1-none

  - name: Cache Cargo Dependencies
    uses: actions/cache@v4
    with:
      path: |
        ~/.cargo/bin
        ~/.cargo/registry
        ~/.cargo/git
        target
      key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      restore-keys: |
        ${{ runner.os }}-cargo-

  - name: Install Stellar CLI
    run: cargo install --locked stellar-cli --version 22.0.1 --features opt || true

  - name: Build Reputation Contract
    run: cargo build --target wasm32v1-none --release -p reputation

  - name: Build Escrow Factory Contract
    run: cargo build --target wasm32v1-none --release -p escrow-factory

  - name: Build Escrow Contract
    run: cargo build --target wasm32v1-none --release -p escrow

  - name: Run Cargo Tests
    run: cargo test --verbose -j 1
```

frontend-tests:
name: Frontend Tests & Build
runs-on: ubuntu-latest
needs: rust-tests

```
steps:
  - name: Checkout Code
    uses: actions/checkout@v4

  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: '22'
      cache: npm
      cache-dependency-path: frontend/package-lock.json

  - name: Install Dependencies
    working-directory: frontend
    run: npm install --legacy-peer-deps

  - name: Run ESLint
    working-directory: frontend
    run: npm run lint

  - name: Run Vitest
    working-directory: frontend
    run: npx vitest run

  - name: Build Frontend
    working-directory: frontend
    run: npm run build
```
